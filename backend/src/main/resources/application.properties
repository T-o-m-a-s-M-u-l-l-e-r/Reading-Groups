spring.application.name=reading_groups

# Database connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Token secret
jwt.secret=${JWT_SECRET}

# Public endpoints
app.public.paths=/api/registration-rules,/api/groups/join/*/preview,/api/groups/join/*/icon,/api/auth/email-verification/verify,/api/users,/api/auth/login,/api/auth/refresh,/api/auth/logout,/swagger-ui/**,/v3/api-docs/**

# File storage root
app.storage.root=./uploads

# Email verification
app.email-verification.cooldown=PT2M
app.email-verification.lifetime=PT24H

# Public app address, shared with Caddy through Compose.
app.base-url=${APP_BASE_URL}
# Frontend paths.
app.email-verification.path=/verify-email
app.group-join-link.path=/join
app.email-verification.page-url=${app.base-url}${app.email-verification.path}
app.group-join-link.page-url=${app.base-url}${app.group-join-link.path}

# Environment-specific delivery settings are defined explicitly in .env or the shell.
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS_ENABLE}
spring.mail.properties[mail.smtp.starttls.required]=${SMTP_STARTTLS_REQUIRED}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
app.email.from=${EMAIL_FROM}

# Optional group icons: 1 MiB, up to 4096 pixels per side, stored as 256px PNGs.
app.group-icon.max-bytes=1048576
app.group-icon.max-dimension=4096
app.group-icon.size=256
