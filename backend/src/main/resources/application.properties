spring.application.name=reading_groups

# Database connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Token secret
jwt.secret=${JWT_SECRET}

# Public endpoints
app.public.paths=/api/auth/email-verification/verify,/api/users,/api/auth/login,/api/auth/refresh,/api/auth/logout,/swagger-ui/**,/v3/api-docs/**

# File storage root
app.storage.root=./uploads

# Email verification
app.email-verification.cooldown=PT2M
app.email-verification.lifetime=PT24H

# TODO: Set this to the frontend verification page (the frontend route is not implemented yet).
app.email-verification.page-url=${EMAIL_VERIFICATION_PAGE_URL:https://your-app.example/verify-email}

# TODO: Supply your provider's SMTP settings and authorized sender via environment variables.
# Port 587 with required STARTTLS is a common setup; adjust to your provider's requirements.
spring.mail.host=${SMTP_HOST:smtp.example.invalid}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:REPLACE_WITH_SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD:REPLACE_WITH_SMTP_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
app.email.from=${EMAIL_FROM:no-reply@example.invalid}
