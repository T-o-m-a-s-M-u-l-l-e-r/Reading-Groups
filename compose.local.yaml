# Local additions: source builds, loopback-only developer ports, and captured email.
services:
  caddy:
    build: frontend
    volumes:
      - ./frontend/Caddyfile.local:/etc/caddy/Caddyfile:ro

  database:
    ports:
      - "127.0.0.1:5432:5432"

  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  app:
    build: backend
    depends_on:
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
